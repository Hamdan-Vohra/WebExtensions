<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Reading Timer</title>
    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      html,
      body {
        display: flex;
        flex-direction: column;
        font-family: sans-serif;
        background: #f8f9fa;
        width: 250px; /* fixed width */
        margin: 0 auto; /* horizontal center */
        padding-top: 5px; /* space from top */
        text-align: center;
        box-sizing: border-box;
        position: relative; /* default, no need for absolute */
        justify-content: center;
        align-items: center;
      }

      #timer {
        font-size: 24px;
        font-weight: bold;
        margin: 10px;
      }

      button {
        cursor: pointer;
        margin: 5px 0;
        padding: 8px 12px;
        border: none;
        border-radius: 5px;
        background: #007bff;
        color: #fff;
        width: 70%;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      button:hover {
        background: #0056b3;
      }
    </style>
  </head>
  <body>
    <h3>Reading Timer</h3>
    <p id="timer">00:00</p>
    <button id="start"><i class="fas fa-play"></i> Start</button>
    <button id="pause"><i class="fas fa-pause"></i> Pause</button>
    <button id="restart"><i class="fas fa-redo"></i> Restart</button>
    <button id="stop"><i class="fas fa-stop"></i> Stop</button>

    <script src="scripts/popup.js"></script>
  </body>
</html>
